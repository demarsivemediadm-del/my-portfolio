name: Keep the site database awake
# Supabase pauses free projects after about a week without activity.
# This asks the database one small question twice a week so that never happens.
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database for one row
        run: |
          curl --fail --silent --show-error \
            -H "apikey: sb_publishable_ohGRmn9Z4WkG3jdTloWOyg_Jd4zEcn_" \
            "https://vxzpbznyzkixqcmdqyco.supabase.co/rest/v1/reviews?select=id&limit=1"
